name: Manual digest release

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: Previously published immutable tag, for example sha-0123... (40 hex characters)
        required: true
        type: string
      target_environment:
        description: GitHub Environment; production must have required reviewers
        required: true
        type: choice
        options: [staging, production]
      provider:
        description: Deployment adapter
        required: true
        type: choice
        options: [render]

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ inputs.target_environment }}-backend
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      image: ${{ steps.resolve.outputs.image }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve published tag to immutable digest
        id: resolve
        shell: bash
        env:
          VERSION: ${{ inputs.image_version }}
        run: |
          [[ "$VERSION" =~ ^sha-([0-9a-f]{40})$ ]] || { echo 'image_version must be sha- plus 40 lowercase hex characters' >&2; exit 1; }
          source_sha="${BASH_REMATCH[1]}"
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}-backend"
          # shellcheck disable=SC2016
          digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Registry did not return an immutable sha256 digest' >&2; exit 1; }
          {
            echo "source_sha=$source_sha"
            echo "image=$image"
            echo "digest=$digest"
            echo "image_ref=${image}@${digest}"
          } >> "$GITHUB_OUTPUT"
          printf 'Resolved %s:%s to %s@%s.\n' "$image" "$VERSION" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

  approve-and-migrate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked migration tooling
        working-directory: backend
        run: npm ci
      - name: Validate and apply reviewed migrations
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run prisma:validate
          npm run prisma:generate
          npm run db:migrate:deploy
          npm run db:grants
          npm run db:verify

  deploy:
    needs: [resolve, approve-and-migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Deploy exact digest with Render adapter
        if: inputs.provider == 'render'
        env:
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: node .github/scripts/render-deploy.js
      - name: Release record
        env:
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          {
            echo '### Release complete'
            printf 'Environment: %s\n' "$TARGET_ENVIRONMENT"
            echo 'Component: backend'
            printf 'Image: %s\n' "$IMAGE_REF"
          } >> "$GITHUB_STEP_SUMMARY"
