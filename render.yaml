# Operator migrations and grants run separately. Never give the web service owner credentials.
services:
  - type: web
    name: frontdesk-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm prune --omit=dev --omit=optional
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: NODE_ENV
        value: production
      - key: TZ
        value: UTC
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JOB_TOKEN
        generateValue: true
      - key: FRONTDESK_HOLIDAYS
        value: '[]'
